name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to check when called by the release workflow
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Keep this separate from the caller's concurrency group when reused for releases.
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build and test
    # Build against glibc 2.35 so the executable also runs in Debian Bookworm.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      RUSTUP_TOOLCHAIN: "1.99.0"
      CHUNKIFY_BINARY: ${{ github.workspace }}/target/ci/chunkify-analytics
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: npm ci
      - name: Test schema and dashboard
        run: node --test tests/http/openapi-schema.test.mjs examples/dashboard/*.test.*
      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: linked-duckdb-ci-ubuntu22-v1
          cache-on-failure: true
      - name: Install prebuilt DuckDB
        run: sh scripts/install-duckdb.sh
      # cargo test also builds the real executable for integration tests. Build
      # that dependency graph first so later checks reuse the same artifacts.
      - name: Build analytics server and test executables
        run: cargo test --locked --profile ci --no-run
      - name: Run Rust tests
        run: cargo test --locked --profile ci
      - run: cargo clippy --locked --profile ci --all-targets -- -D warnings
      - name: Install browser test runtime
        # The runner already has Chromium's runtime libraries. SDK tests do not
        # need the optional font packages installed by --with-deps.
        run: npx playwright install --only-shell chromium
      - name: Test native demo, HTTP API and browser adapters
        run: node --test examples/demo/*.test.mjs tests/http/*.test.mjs
      - name: Prepare tested executable for Docker
        run: |
          mkdir -p target/container/usr/local/bin target/container/opt/duckdb
          cp "$CHUNKIFY_BINARY" target/container/usr/local/bin/chunkify-analytics
          cp target/lib/libduckdb.so target/container/opt/duckdb/libduckdb.so
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Validate Dockerfile
        run: docker buildx build --check .
      - name: Package tested analytics image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          # A named context overrides the build stage, reusing the executable
          # above instead of compiling it for a second time inside Docker.
          build-contexts: build=./target/container
          platforms: linux/amd64
          load: true
          tags: chunkify-analytics:test
          cache-from: type=gha,scope=collector-runtime-amd64
          cache-to: type=gha,scope=collector-runtime-amd64,mode=max
      - name: Test container lifecycle and benchmark runner
        run: node --test tests/http/docker/*.test.mjs
