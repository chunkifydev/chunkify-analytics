name: Analytics collector

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  collector:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      RUSTUP_TOOLCHAIN: "1.99.0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: linked-duckdb-v1
      - name: Install prebuilt DuckDB
        run: sh scripts/install-duckdb.sh
      - run: npm ci
      - run: npm run check:collector:openapi
      - name: Test local dashboard
        run: node --test examples/dashboard/*.test.*
      - run: npx playwright install --with-deps --only-shell chromium
      - run: cargo fmt --check
      - name: Build collector
        run: cargo build --locked
      - name: Test native demo lifecycle
        run: node --test examples/demo/*.test.mjs
      - name: Test HTTP API and browser adapters
        run: node --test tests/http/*.test.mjs
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build collector image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: chunkify-analytics:test
          cache-from: type=gha,scope=collector-linked-amd64
          cache-to: type=gha,scope=collector-linked-amd64,mode=max
      - name: Test container lifecycle and benchmark runner
        run: node --test tests/http/docker/*.test.mjs
