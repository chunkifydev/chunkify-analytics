[package]
name = "chunkify-analytics"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Self-hosted storage and queries for Chunkify playback analytics"

[features]
bundled-duckdb = ["duckdb/bundled", "duckdb/json", "duckdb/parquet"]

[dependencies]
axum = "0.8.9"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
duckdb = { version = "=1.20000.0", default-features = false }
flate2 = "1"
futures = "0.3"
ipnet = "2"
ring = "0.17.14"
rust-s3 = { version = "0.38", default-features = false, features = ["sync-rustls-tls"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
toml = "1.1.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }

[profile.dev]
debug = 0
